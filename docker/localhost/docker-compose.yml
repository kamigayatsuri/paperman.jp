# 我は汝に興味なく、汝も我に興味なし。我と汝の心懐を交わすに能わず。沈黙こそが価値。忘れ去らん。
name: "paperman-jp"

services:
  # Web server
  www-front:
    hostname: "paperman-www-front"
    container_name: "paperman-www-front"
    build:
      context: .
      # args:
    volumes:
      - "../../src:/var/www/src"
    ports:
      - "80:80"
      - "443:443"

  # This is only front-end, so then non databases.